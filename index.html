<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Idle Hands</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #tag { position: fixed; left: calc(env(safe-area-inset-left) + 4vw); top: calc(env(safe-area-inset-top) + 3vh); color: #8f8a9e; font: 12px ui-monospace, Menlo, monospace; pointer-events: none; text-shadow: 1px 1px 0 #000; }
  #area {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 9vh); text-align: center; pointer-events: none;
    color: #e8e4f0; font: bold clamp(18px, 3.4vw, 30px) "Times New Roman", Times, serif; letter-spacing: 6px;
    text-shadow: 2px 2px 0 #000; transition: opacity 1.2s; opacity: 0;
  }
  #clock {
    position: fixed; left: calc(env(safe-area-inset-left) + 4vw); bottom: calc(env(safe-area-inset-bottom) + 5vh);
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; pointer-events: none;
    background: #121214; border-radius: 10px 10px 6px 6px; box-shadow: inset 0 2px 0 #2a2a2e, inset 0 -3px 0 #050506, 0 4px 0 #050506;
  }
  #digits { display: flex; align-items: center; gap: 3px; background: #1a0605; padding: 5px 7px; border-radius: 3px; box-shadow: inset 0 0 8px #000; }
  .h, .m { display: flex; gap: 3px; }
  .dg { width: clamp(13px, 2.8vw, 24px); height: auto; }
  .dg .on { fill: #ff2a1a; filter: drop-shadow(0 0 3px rgba(255,40,20,.85)); }
  .dg .off { fill: #2a0a08; }
  #colon { display: flex; flex-direction: column; gap: clamp(4px, 1vw, 8px); padding: 0 2px; }
  #colon i { width: clamp(3px, .6vw, 5px); height: clamp(3px, .6vw, 5px); background: #ff2a1a; box-shadow: 0 0 4px #ff2a1a; display: block; }
  #colon.dim i { background: #3a0c08; box-shadow: none; }
  #side { display: flex; flex-direction: column; gap: 5px; font: bold 8px Arial, sans-serif; color: #5a1a14; letter-spacing: .5px; }
  #pm.lit { color: #ff2a1a; text-shadow: 0 0 4px #ff2a1a; }
  #pad { position: fixed; right: calc(env(safe-area-inset-right) + 4vw); bottom: calc(env(safe-area-inset-bottom) + 4vh); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
  #pad button {
    all: unset; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 6px;
    background: rgba(20,18,30,.55); border: 1px solid rgba(200,190,230,.25); color: #d8d4e8; font: 20px ui-monospace, Menlo, monospace;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #pad button:active { background: rgba(80,70,120,.6); }
  #pad button.off { opacity: .25; }
  #pad #b-up { grid-column: 2; grid-row: 1; } #pad #b-left { grid-column: 1; grid-row: 2; } #pad #b-down { grid-column: 2; grid-row: 2; } #pad #b-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div id="tag">idle hands · after hours v0.8</div>
<div id="area"></div>
<div id="clock">
  <div id="digits"><span class="h"></span><span id="colon"><i></i><i></i></span><span class="m"></span></div>
  <div id="side"><span id="pm">PM</span><span id="alarm">ALARM</span></div>
</div>
<div id="pad">
  <button id="b-up" aria-label="Forward">▲</button>
  <button id="b-left" aria-label="Turn left">◀</button>
  <button id="b-down" aria-label="Turn around">▼</button>
  <button id="b-right" aria-label="Turn right">▶</button>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./main.js?v=9"></script>
</body>
</html>
