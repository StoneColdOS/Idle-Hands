<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Idle Hands</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #clock {
    position: fixed; left: calc(env(safe-area-inset-left) + 4vw); bottom: calc(env(safe-area-inset-bottom) + 5vh);
    display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 14px; pointer-events: none;
    background: #121214; border-radius: 10px 10px 6px 6px;
    box-shadow: inset 0 2px 0 #2a2a2e, inset 0 -3px 0 #050506, 0 4px 0 #050506;
  }
  #digits { display: flex; align-items: center; gap: 3px; background: #1a0605; padding: 6px 8px; border-radius: 3px; box-shadow: inset 0 0 8px #000; }
  .h, .m { display: flex; gap: 3px; }
  .dg { width: clamp(16px, 3.6vw, 30px); height: auto; }
  .dg .on { fill: #ff2a1a; filter: drop-shadow(0 0 3px rgba(255,40,20,.85)); }
  .dg .off { fill: #2a0a08; }
  #colon { display: flex; flex-direction: column; gap: clamp(5px, 1.2vw, 10px); padding: 0 2px; }
  #colon i { width: clamp(3px, .7vw, 6px); height: clamp(3px, .7vw, 6px); background: #ff2a1a; box-shadow: 0 0 4px #ff2a1a; display: block; }
  #colon.dim i { background: #3a0c08; box-shadow: none; }
  #side { display: flex; flex-direction: column; gap: 6px; font: bold 9px Arial, sans-serif; color: #5a1a14; letter-spacing: .5px; }
  #pm.lit { color: #ff2a1a; text-shadow: 0 0 4px #ff2a1a; }
  #hint {
    position: fixed; right: 4vw; top: calc(env(safe-area-inset-top) + 3vh); color: #cfc8b8;
    font: 13px ui-monospace, Menlo, monospace; opacity: .85; transition: opacity 1.5s; pointer-events: none;
    text-shadow: 1px 1px 0 #000;
  }
  #tag {
    position: fixed; left: 4vw; top: calc(env(safe-area-inset-top) + 3vh); color: #8f8a7e;
    font: 12px ui-monospace, Menlo, monospace; pointer-events: none; text-shadow: 1px 1px 0 #000;
  }
</style>
</head>
<body>
<div id="tag">idle hands · style test v0.4</div>
<div id="hint">tap / A / space: next shot</div>
<div id="clock">
  <div id="digits"><span class="h"></span><span id="colon"><i></i><i></i></span><span class="m"></span></div>
  <div id="side"><span id="pm">PM</span><span id="alarm">ALARM</span></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./main.js?v=4"></script>
</body>
</html>
